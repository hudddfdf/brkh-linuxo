name: Build brkh linux ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up mirrors
        run: |
          echo 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          echo 'Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch' >> /etc/pacman.d/mirrorlist

      - name: Install archiso
        run: pacman -Sy --noconfirm archiso

      - name: Build ISO
        run: |
          mkdir -p /build
          cp profiledef.sh pacman.conf packages.x86_64 /build/
          cp -r airootfs /build/
          mkarchiso -v -w /tmp/work -o /output /build

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: brkh-linux-iso
          path: /output/*.iso
          retention-days: 7
